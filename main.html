 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
      <div class="wrapper">
         <div class="video-container">
           <video class="flex"  src="https://www.w3schools.com/html/mov_bbb.mp4" controls></video>
           <div class="progress__filled">
               <div class="timeline"></div>
           </div>

           <div class="player__control">
             <button id="rewind">&#9664;&#9664;</button>
             <button class="player__button" id="play">&#9658;</button>
             <button class="player__button toggle" id="pause">&#10074;&#10074;</button>
             <button id="skipButton">&#9654;&#9654;</button>
            </div>
          <div class="volume__time">
            <div class="time-section">
              <span class="current-time">00:00</span>
            </div>
            <div class="volume__speed">
              <div class="speed__bar">
                   <button id="speed"><img src="speed-removebg-preview.png" height="15px" width="25px" alt=""></button>
                   <select name="speed" class="playback-speed show">
                   <option>0.5x</option>
                   <option>1x</option>
                   <option>2x</option>
                  </select>
                  </div>
                  <button class="volume" id="volume">&#128266;</button>
                  <!-- <input type="range" class="volume-slider show" min="0" value="50" max="100"> -->
                  <select name="speed" class="volume-slider show">
                   <option>25%</option>
                   <option>50%</option>
                   <option>100%</option>
                  </select>
            </div>
          </div>
         </div>
      </div>
</body>
<script src="./script.js"></script>
</html>
